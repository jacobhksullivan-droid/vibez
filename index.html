<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seb &amp; Jacob's Epic Camper Adventure</title>
<meta name="theme-color" content="#0d3b52">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Epic Camper">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gateForm" class="gate-card">
    <div class="brand">Seb &amp; Jacob's<br><span>Epic Camper Adventure</span></div>
    <label for="gatePass">Passcode</label>
    <input id="gatePass" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <button type="submit">Unlock</button>
    <p id="gateMsg" role="status"></p>
  </form>
</div>
<header class="topbar">
  <div class="brand"><span>Epic Camper Adventure</span></div>
  <div class="status" id="status" role="status">Loading forecast…</div>
  <button class="iconbtn" id="refreshBtn" type="button" aria-label="Refresh forecast">↻</button>
</header>

<div class="controls" id="controls" hidden>
  <select id="daySel" aria-label="Day"></select>
  <div class="seg" id="modeSeg" aria-label="Show">
    <button type="button" data-mode="both" aria-pressed="true">All</button>
    <button type="button" data-mode="surf" aria-pressed="false" aria-label="Surf">🏄</button>
    <button type="button" data-mode="spear" aria-pressed="false" aria-label="Spear">🐟</button>
  </div>
  <select id="winSel" aria-label="Time of day">
    <option value="best">Best</option>
  </select>
</div>

<main>
  <section id="homeView" class="view scrollview"><div id="home" class="pad"></div><p class="disclaimer">Decision support only · check conditions yourself · dive one-up-one-down</p></section>
  <section id="mapView" class="view" hidden>
    <div id="map" aria-label="Map of spots"></div>
    <div class="legend" aria-hidden="true">
      <span class="scale"><b style="background:var(--s1)">0</b><b style="background:var(--s3)">3</b><b style="background:var(--s5)">5</b><b style="background:var(--s7)">7</b><b style="background:var(--s9)">9</b></span>
    </div>
  </section>
  <section id="outlookView" class="view scrollview" hidden><div id="outlook" class="pad"></div></section>
  <section id="coastView" class="view scrollview" hidden><div id="coast" class="pad"></div></section>
  <section id="listView" class="view" hidden>
    <div id="list" class="list"></div>
  </section>
</main>
<nav class="tabbar" aria-label="Views">
  <button type="button" data-view="homeView" aria-pressed="true" aria-label="Home" title="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button type="button" data-view="mapView" aria-pressed="false" aria-label="Map" title="Map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></svg><span>Map</span></button>
  <button type="button" data-view="coastView" aria-pressed="false" aria-label="Coast" title="Coast"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0M3 14c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0M3 19c2-1.6 4-1.6 6 0s4 1.6 6 0 4-1.6 6 0"/></svg><span>Coast</span></button>
  <button type="button" data-view="listView" aria-pressed="false" aria-label="List" title="List"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.75" cy="7" r=".9"/><circle cx="4.75" cy="12" r=".9"/><circle cx="4.75" cy="17" r=".9"/></svg><span>List</span></button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner">
    <button class="iconbtn close" id="sheetClose" type="button" aria-label="Close">✕</button>
    <div id="sheetBody"></div>
  </div>
</div>



<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="src/gate.js"></script>
</body>
</html>
